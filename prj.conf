# ======================================================================
# H7_Work / STM32H723VG   prj.conf
#
# 约定：
#  1) 本文件里注释必须"独占一行、以 # 开头"；
#     不要写  CONFIG_FOO=1 // 说明   —— 值会解析失败并静默回退默认值
#  2) *_LOG_LEVEL_* 是 Kconfig choice：同一模块只能出现一条
#  3) CONFIG_USBD_MAX_SPEED 是派生量（=1 表示编入 HS 支持），不要手写
#     —— 由 UDC_STM32 的 UDC_DRIVER_HAS_HIGH_SPEED_SUPPORT 自动选 HIGH
# ======================================================================

# ------------------------------------------------------------------ 1. 时钟
# STM32 时钟控制驱动：配置 PLL / 总线时钟
CONFIG_CLOCK_CONTROL=y

# ------------------------------------------------------------------ 2. 系统节拍
# 100 kHz tick = 10 µs 一拍（精度高，但 tick 中断开销也高；不需要可降到 10000）
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# ------------------------------------------------------------------ 3. 内核 / 运行时观测
# C++ 静态对象在 main() 之前就构造好
CONFIG_STATIC_INIT_GNU=y
# 保留 assert：失败先打日志再挂住，便于定位（构建时看到
# "__ASSERT() statements are globally ENABLED" 是正常的）
CONFIG_ASSERT=y
# FPU / 打印支持：让 RTT 能打 float
CONFIG_CBPRINTF_FP_SUPPORT=y

# 线程分析器：查每个线程的栈用量 / CPU 占用（纯调试用，平时可整组关掉）
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_PRINT_THREAD_PRIORITY=y
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y
# 用 k_thread_foreach_unlocked：逐字扫线程栈很慢，不要长时间关中断
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
# 线程名字（分析器输出里显示）
CONFIG_THREAD_NAME=y

# ------------------------------------------------------------------ 4. 内存 / 线程栈
# 所有中断共用栈
CONFIG_ISR_STACK_SIZE=8192
# 系统堆（k_malloc）
CONFIG_HEAP_MEM_POOL_SIZE=8192
# 系统工作队列 sysworkq
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# main 线程栈：usbd_add_configuration/init/enable 等初始化都跑在 main 里
CONFIG_MAIN_STACK_SIZE=4096

# ------------------------------------------------------------------ 5. 日志（RTT 后端）
# 关键: deferred —— 日志由 log 线程格式化输出，不要在 UDC / USB 事件线程里同步写 RTT
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y

# 允许用 devicetree 的 zephyr,memory-region 建立 no-cache 内存区
CONFIG_NOCACHE_MEMORY=y
# 把 RTT 控制块/缓冲放到 DTS 的 RTT_NOCACHE 区：Cortex-M7 有 D-cache，
# 放在可缓存内存里 pyocd 读 RTT 会 "Memory transfer fault (FAULT ACK)"
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y
# 上行缓冲满时丢日志，而不是阻塞调用者（UDC 线程 / 中断不能等）
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# 不加时间戳（省 CPU / 栈）
CONFIG_LOG_BACKEND_SHOW_TIMESTAMP=n
# 全局级别 3 = INF
CONFIG_LOG_DEFAULT_LEVEL=3

# 上行缓冲 / LOG 环形缓冲 / log 线程栈
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8000
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=8000

# ------------------------------------------------------------------ 6. 各模块日志级别
# ★ 同一模块的 *_LOG_LEVEL_* 只能有一条（choice），想开 DBG 就先把同模块的 WRN 注释掉
#
# gs_usb 类：只留 WRN，避免每帧都刷屏
CONFIG_USBD_GS_USB_LOG_LEVEL_WRN=y
# CAN 子系统：只留 WRN（过滤器 out-of-bounds 的 LOG_ERR 仍会打印）
CONFIG_CAN_LOG_LEVEL_WRN=y
#
# ★ 调试开关（上板抓完日志后建议全部改回 WRN）
# UDC 驱动：DBG 会把每个端点的 ep_check_config 都打出来，一大串，淹没关键日志
# CONFIG_UDC_DRIVER_LOG_LEVEL_DBG=y
CONFIG_UDC_DRIVER_LOG_LEVEL_INF=y
# usbd 协议栈核心：DBG 打印描述符 / 配置 / 类注册过程（排查枚举时保留）
CONFIG_USBD_LOG_LEVEL_DBG=y
# CONFIG_USBD_LOG_LEVEL_INF=y

# ------------------------------------------------------------------ 7. USB 设备栈（device_next）
# cannectivity 的 gs_usb 类依赖新一代 device stack
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_NONZERO_SPINLOCK_SIZE=y

# usbd 协议栈线程 / STM32 UDC 驱动线程（日志里的 usb@40040000）
CONFIG_USBD_THREAD_STACK_SIZE=8192
CONFIG_UDC_STM32_STACK_SIZE=4096

# ------------------------------------------------------------------ 8. UDC 端点缓冲（net_buf）
# 个数：USB 满载时不够会 enqueue 失败 / 丢帧 16~256
CONFIG_UDC_BUF_COUNT=64
# 总量（字节，64~32768）；必须和上面的 count 配对加大，
# HS 满包 512B 时单次请求占用明显变大
CONFIG_UDC_BUF_POOL_SIZE=16384

# HS(MPS=512) 下 OTG 的 RxFIFO 基线：默认 600 只够塞 1 个 512B 包且无余量
# 实际 RxFIFO = 1024/4 + 2 + 2×num_endpoints = 276 words ≈ 1.1 KB（专用 RAM 4 KB 够）
CONFIG_UDC_STM32_OTG_RXFIFO_BASELINE_SIZE=1024

# ------------------------------------------------------------------ 9. gs_usb 设备类
# 通道数 = can_channels[] 的元素个数 = M_S_Control 各表的元素个数，三者必须一致
# channel0 = can0(真实 FDCAN1, PD0/PD1)
# channel1 = can1(虚拟回环 zephyr,can-loopback)
# channel2 = can2(真实 FDCAN3, PD12/PD13)
CONFIG_USBD_GS_USB_MAX_CHANNELS=3

# 主机帧缓冲池：元素 = 12B 头 + 64B 数据(FD) = 76B
CONFIG_USBD_GS_USB_POOL_SIZE=192

# Linux gs_usb < 6.12.5 硬编码 EP 0x81 / 0x02，需要多一个 bulk OUT 端点兜底
CONFIG_USBD_GS_USB_COMPATIBILITY_MODE=y

# 收发线程优先级（数值越小越高；TX 1 / RX 2，均高于 log 线程）
CONFIG_USBD_GS_USB_TX_THREAD_PRIO=1
CONFIG_USBD_GS_USB_RX_THREAD_PRIO=2
CONFIG_USBD_GS_USB_TX_THREAD_STACK_SIZE=8192
CONFIG_USBD_GS_USB_RX_THREAD_STACK_SIZE=8192

# can_loopback（虚拟 can1）驱动的发送线程栈
CONFIG_CAN_LOOPBACK_TX_THREAD_STACK_SIZE=2048

# ------------------------------------------------------------------ 10. CAN / FDCAN
# CAN FD 模式（FDF/BRS 帧，5M 数据段必需）
CONFIG_CAN_FD_MODE=y
# 统计框架 + CAN 统计（bit/bit0 error、bus-off 计数）
CONFIG_STATS=y
CONFIG_CAN_STATS=y

# ------------------------------------------------------------------ 11. 可选功能（要用再打开）
# 每帧附加硬件时间戳
# CONFIG_USBD_GS_USB_TIMESTAMP=y
# 时间戳改用 USB SOF 做基准（精度更高，但每帧一次 SOF 中断）
# CONFIG_USBD_GS_USB_TIMESTAMP_SOF=y

# ------------------------------------------------------------------ 12. 调试（ULPI 排查用，定位完可关掉）
# 让 gdb 能列出所有线程并打印各自调用栈（pyocd gdbserver 会提示需要它）
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_MONITOR=y