# ------------------------------------------------------------------ 时钟
# STM32 时钟控制驱动：配置 PLL/总线时钟
CONFIG_CLOCK_CONTROL=y

# ------------------------------------------------------------------ 调试 / 运行时观测
# 保留 assert: 失败会先打日志再挂住，便于定位。
CONFIG_ASSERT=y
# 线程分析器：查每个线程的栈用量 / CPU 占用
CONFIG_THREAD_ANALYZER=y
# 打印每个线程的优先级
CONFIG_THREAD_ANALYZER_PRINT_THREAD_PRIORITY=y
# 顺便统计中断栈（ISR0）的用量
CONFIG_THREAD_ANALYZER_ISR_STACK_USAGE=y
# 分析时用 k_thread_foreach_unlocked：逐字扫所有线程栈很慢，不要长时间关中断
CONFIG_THREAD_ANALYZER_RUN_UNLOCKED=y
# 线程名字
CONFIG_THREAD_NAME=y

# ------------------------------------------------------------------ 日志 (RTT 后端)
# 关键: deferred —— 日志由 log 线程格式化输出，不要在 UDC / USB 事件线程里同步写 RTT。
# 打开日志子系统（不开的话 LOG_ERR/LOG_INF 会在编译期被剔除）
CONFIG_LOG=y
# 延迟模式：调用者只入队，格式化/输出交给 logging 线程（不拖慢中断、UDC 线程）
CONFIG_LOG_MODE_DEFERRED=y
# 日志后端用 SEGGER RTT
CONFIG_LOG_BACKEND_RTT=y
# 启用 SEGGER RTT 本体
CONFIG_USE_SEGGER_RTT=y
# 允许用 devicetree 的 zephyr,memory-region 建立 no-cache 内存区
CONFIG_NOCACHE_MEMORY=y
# 把 RTT 控制块/缓冲放到 DTS 的 RTT_NOCACHE 区：Cortex-M7 有 D-cache，
# 放在可缓存内存里 pyocd 读 RTT 会 "Memory transfer fault (FAULT ACK)"
CONFIG_SEGGER_RTT_SECTION_CUSTOM_DTS_REGION=y
# RTT 上行缓冲满时丢日志，而不是阻塞调用者（UDC 线程 / 中断不能等）
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# 全局日志级别 3 = INF：保留自己的 LOG_INF 调试输出
CONFIG_LOG_DEFAULT_LEVEL=3

# LOG环形缓冲大小（analyzer 一次吐几十行；发现丢行就加大）
CONFIG_LOG_BUFFER_SIZE=4096
# logging 线程栈（格式化 + 写 RTT 都在这个线程栈上跑）
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# 以下三个模块只保留 WRN 及以上级别，避免 RTT 被刷屏
CONFIG_USBD_GS_USB_LOG_LEVEL_WRN=y
CONFIG_CAN_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# ------------------------------------------------------------------ 内存分配 / 线程栈
# 所有中断栈
CONFIG_ISR_STACK_SIZE=8192
# 系统堆
CONFIG_HEAP_MEM_POOL_SIZE=8192
# 系统工作队列 sysworkq 线程栈
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# main 线程栈（usbd_init/usbd_enable 等初始化都跑在 main 里）
CONFIG_MAIN_STACK_SIZE=4096

# ------------------------------------------------------------------ USB 设备栈 / 缓冲
# 用新一代 USB device 栈（device_next）；cannectivity 的 gs_usb 类依赖它
CONFIG_USB_DEVICE_STACK_NEXT=y
# UDC 端点缓冲（net_buf）个数：USB 满载时不够会 enqueue 失败/丢帧 16～256
CONFIG_UDC_BUF_COUNT=64
# 上面这个缓冲池的总字节数 64~32768
CONFIG_UDC_BUF_POOL_SIZE=8192
# STM32 UDC 驱动线程栈 = 日志里的 usb@40040000（USB 端点事件/数据搬运用）
CONFIG_UDC_STM32_STACK_SIZE=4096
# usbd 协议栈线程栈
CONFIG_USBD_THREAD_STACK_SIZE=8192

# gs_usb_tx 线程
CONFIG_USBD_GS_USB_TX_THREAD_STACK_SIZE=8192
# gs_usb_rx 线程
CONFIG_USBD_GS_USB_RX_THREAD_STACK_SIZE=8192
# can_loopback（虚拟 can0）驱动的发送线程栈
CONFIG_CAN_LOOPBACK_TX_THREAD_STACK_SIZE=2048

# ------------------------------------------------------------------ gs_usb 设备类
# 暴露给主机的通道数：channel0 = can0(虚拟回环)，channel1 = can1(真实 FDCAN2)
CONFIG_USBD_GS_USB_MAX_CHANNELS=2
# 主机帧缓冲池: 元素 = 12B 头 + 64B 数据 (FD 模式) = 76B，
CONFIG_USBD_GS_USB_POOL_SIZE=192

# Linux gs_usb < 6.12.5 硬编码 EP 0x81 / 0x02，需要多一个 bulk OUT 端点兜底
CONFIG_USBD_GS_USB_COMPATIBILITY_MODE=y

# 收发线程优先级建议小于CAN所有FIFO，当前TX 0,RX 0
CONFIG_USBD_GS_USB_RX_THREAD_PRIO=2
CONFIG_USBD_GS_USB_TX_THREAD_PRIO=1

# ------------------------------------------------------------------ CAN / FDCAN
# CAN FD 模式：支持 FDF/BRS 帧，5M 数据段波特率需要它
CONFIG_CAN_FD_MODE=y
# 通用统计框架（下面的 CAN 统计依赖它）
CONFIG_STATS=y
# CAN 统计：bit/bit0 error、bus-off 等计数，对应 can_stats_get_*() 接口
CONFIG_CAN_STATS=y

# ------------------------------------------------------------------ 可选（要用再打开）
# 给每帧附加硬件时间戳
# CONFIG_USBD_GS_USB_TIMESTAMP=y
# 时间戳改用 USB SOF 做基准：精度更高，但每帧一次 SoF 中断（开销↑）
# CONFIG_USBD_GS_USB_TIMESTAMP_SOF=y