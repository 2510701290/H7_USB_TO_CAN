# ===== CLOCK =====
CONFIG_CLOCK_CONTROL=y

# ===== 调试配置 =====
# 只保留 assert：失败会先打日志再挂住，便于定位。
# DEBUG / DEBUG_THREAD_INFO 会引入大量线程/调试信息，对功能无帮助，建议关掉。
CONFIG_ASSERT=y
# CONFIG_DEBUG=y
# CONFIG_DEBUG_THREAD_INFO=y

# ===== RTT & LOG =====
# 关键：deferred（日志由 log 线程格式化输出），
# 不要在 UDC / USB 事件线程里同步写 RTT。
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_USE_SEGGER_RTT=y

# 明确不阻塞
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y

# INF：保留你自己的 LOG_INF 调试输出
CONFIG_LOG_DEFAULT_LEVEL=3

# deferred 缓冲，减少丢日志
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

# 各模块降噪（同一个 choice 只留一个成员，DBG 那行不要保留）
# gs_usb 类：只留 WRN/ERR（逐帧 hexdump 是 DBG，自然关闭）
CONFIG_USBD_GS_USB_LOG_LEVEL_WRN=y
CONFIG_CAN_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y

# CONFIG_USBD_LOG_LEVEL 保持默认（跟随 LOG_DEFAULT_LEVEL=INF），
# 这样 usbd 栈的 "protocol error:"、"No configuration set (Address state?)"
# 这类定位 USB 状态的关键 INF 日志仍然可见。

# ===== USB 设备栈 / 缓冲 =====
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_UDC_BUF_COUNT=48
CONFIG_UDC_BUF_POOL_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1536

# UDC 事件线程里要跑 ch9 请求 + CAN 驱动调用，默认 512 太紧
CONFIG_UDC_STM32_STACK_SIZE=2048

# ===== gs_usb 类 =====
CONFIG_USBD_GS_USB_POOL_SIZE=128
CONFIG_USBD_GS_USB_MAX_CHANNELS=1
CONFIG_USBD_GS_USB_COMPATIBILITY_MODE=y
CONFIG_USBD_GS_USB_RX_THREAD_PRIO=-1
CONFIG_USBD_GS_USB_TX_THREAD_PRIO=-1
CONFIG_USBD_GS_USB_RX_THREAD_STACK_SIZE=2048
CONFIG_USBD_GS_USB_TX_THREAD_STACK_SIZE=2048
CONFIG_USBD_GS_USB_MAX_CHANNELS=2


CONFIG_CAN_LOOPBACK_TX_THREAD_STACK_SIZE=2048

# ===== 可选：以后要用 CAN FD 再打开（现在跑 classic 1Mbps 不需要）=====
# CONFIG_CAN_STATS=y
# CONFIG_STATS=y
# CONFIG_CAN_FD_MODE=y